 showStatus(SND_ON?'SOUND ON ('+engine+')':'SOUND OFF');
 if(SND_ON){play('toggle');}
}
var clockTapT=null,isFull=false;
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||null;}
function goFull(){
 var d=document.documentElement,rq,ex;
 if(fsEl()){
  ex=document.exitFullscreen||document.webkitExitFullscreen||document.webkitCancelFullScreen||document.mozCancelFullScreen;
  if(ex){try{ex.call(document);}catch(e){}}
  return;
 }
 if(isFull){ /* fallback mode: leave by resetting */
  isFull=false;document.body.style.minHeight='0';window.scrollTo(0,0);showStatus('NORMAL SCREEN');return;
 }
 rq=d.requestFullscreen||d.webkitRequestFullscreen||d.webkitRequestFullScreen||d.mozRequestFullScreen||d.msRequestFullscreen;
 if(rq){try{rq.call(d);showStatus('FULL SCREEN');return;}catch(e){}}
 /* old stock browser: no Fullscreen API, so scroll the address bar away */
 isFull=true;
 d.style.overflow='auto';document.body.style.overflow='auto';
 document.body.style.minHeight=(H+120)+'px';
 var k;for(k=0;k<4;k++){setTimeout(function(){window.scrollTo(0,1);},60+k*250);}
 setTimeout(layout,1200);
 showStatus('FULL SCREEN');
}
function clockTap(){
 unlock();
 if(clockTapT){clearTimeout(clockTapT);clockTapT=null;goFull();return;}
 clockTapT=setTimeout(function(){clockTapT=null;toggleSnd();},320);
}
var right=$('right');
right.addEventListener('touchstart',function(e){e.preventDefault();lastTouch=new Date().getTime();clockLong=false;clearTimeout(clockPressT);clockPressT=setTimeout(function(){clockLong=true;toggleVoice();},1200);},false);
right.addEventListener('touchend',function(e){e.preventDefault();lastTouch=new Date().getTime();clearTimeout(clockPressT);if(clockLong){clockLong=false;if(voiceWanted){startVoice(true);}return;}clockTap();},false);
right.addEventListener('mousedown',function(e){if(mOk()){clockTap();}},false);
window.addEventListener('resize',layout,false);
document.addEventListener('webkitfullscreenchange',function(){setTimeout(layout,200);},false);
document.addEventListener('fullscreenchange',function(){setTimeout(layout,200);},false);
window.addEventListener('orientationchange',function(){setTimeout(layout,200);},false);

function safe(f){try{f();}catch(e){var d=document.getElementById('dbg');if(d){d.innerHTML+='ERR: '+(e&&e.message?e.message:e)+'<br>';}}}
safe(layout);safe(tick);setInterval(function(){safe(tick);},1000);
safe(resetIdle);safe(blinkLoop);safe(gazeLoop);
setTimeout(function(){safe(layout);},300);setTimeout(function(){safe(layout);},1500);
window.onload=function(){safe(layout);};
})();
